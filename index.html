<!doctype html>
<html lang="id">
<head>
<title>Roster WASH PMI</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DCEBFB">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Archivo:wdth,wght@100..125,700..800&display=swap">
<style>
/* Layout: engineering workspace, same shell as the WASH PMI design app — dark teal header + toolbar + numbered workflow tabs,
   then three panes: tools (left), workspace (center), inspector (right). */
:root{
  --bg:#EEF5FC; --panel:#FFFFFF; --panel-2:#F3F8FE; --line:#D4E4F6; --ink:#0F2A4A; --muted:#52708F; --faint:#8AA5C2;
  --hdr:#DCEBFB; --hdr-2:#FFFFFF; --hdr-ink:#0F2A4A; --hdr-muted:#4D6D91; --hdr-line:rgba(15,42,74,.16); --hdr-btn:rgba(255,255,255,.7);
  --teal:#2F78D4; --teal-ink:#FFFFFF; --teal-soft:#E2EEFC; --water:var(--teal); --water-soft:var(--teal-soft);
  --red:#173F75; --red-ink:#FFFFFF; --red-soft:#D3E3F7; --amber:#2F78D4; --danger:#B4233A;
  --ok:#1E63B8; --ok-soft:#DCEBFC; --warn:#456F9E; --warn-soft:#EAF1FA; --off:#6F86A0; --off-soft:#EEF2F7;
  --band:#2E6FC2; --band-ink:#FFFFFF; --band-muted:#D5E6FB;
  --code:#1E4F8F; --code-2:#5B8BC9;
  --surface:var(--panel); --surface-2:var(--panel-2); --paper:var(--bg);
  --shadow:0 1px 2px rgba(15,42,74,.06),0 10px 30px rgba(15,42,74,.10);
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Archivo","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1424; --panel:#0F1E33; --panel-2:#142842; --line:#20395A; --ink:#E1ECF8; --muted:#8DA7C6; --faint:#6A86A8;
  --hdr:#13294A; --hdr-2:#0A1424; --hdr-ink:#E1ECF8; --hdr-muted:#94B2D6; --hdr-line:rgba(255,255,255,.16); --hdr-btn:rgba(255,255,255,.06);
  --teal:#6AA8F0; --teal-ink:#06162B; --teal-soft:#16345A; --red:#A9C9F2; --red-ink:#06162B; --red-soft:#1B3A63; --amber:#6AA8F0; --danger:#F08A9A;
  --ok:#8EC0F7; --ok-soft:#163557; --warn:#9DB7D6; --warn-soft:#1A2E47; --off:#8DA2BA; --off-soft:#1A2A3E;
  --band:#1A4A86; --band-ink:#FFFFFF; --band-muted:#B9D3F3; --code:#2D5FA3; --code-2:#4F7FBF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1424; --panel:#0F1E33; --panel-2:#142842; --line:#20395A; --ink:#E1ECF8; --muted:#8DA7C6; --faint:#6A86A8;
  --hdr:#13294A; --hdr-2:#0A1424; --hdr-ink:#E1ECF8; --hdr-muted:#94B2D6; --hdr-line:rgba(255,255,255,.16); --hdr-btn:rgba(255,255,255,.06);
  --teal:#6AA8F0; --teal-ink:#06162B; --teal-soft:#16345A; --red:#A9C9F2; --red-ink:#06162B; --red-soft:#1B3A63; --amber:#6AA8F0; --danger:#F08A9A;
  --ok:#8EC0F7; --ok-soft:#163557; --warn:#9DB7D6; --warn-soft:#1A2E47; --off:#8DA2BA; --off-soft:#1A2A3E;
  --band:#1A4A86; --band-ink:#FFFFFF; --band-muted:#B9D3F3; --code:#2D5FA3; --code-2:#4F7FBF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);height:100%}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:700}
h1{font-size:1.5rem}h2{font-size:1.08rem}h3{font-size:.98rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow,.lbl-up{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* ---- shell ---- */
.shell{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr)}
.hdr,.tbar,.tabs{background:var(--hdr);color:var(--hdr-ink);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:9px;flex-wrap:wrap}
.org{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:38px;height:38px;border-radius:50%;background:var(--teal);display:grid;place-items:center;flex:none}
.org small{display:block;color:var(--hdr-muted);font-size:.78rem;font-weight:600;letter-spacing:.02em}
.org b{font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.org .titlewrap{min-width:0}
.hchip{background:var(--hdr-btn);border:1px solid var(--hdr-line);color:var(--hdr-ink);font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:7px;white-space:nowrap}
.hchip .d{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:6px;vertical-align:1px}
.hchip .d.local{background:var(--faint)}
.logos{background:#fff;border-radius:10px;padding:6px 12px;display:flex;gap:14px;align-items:center;flex:none;border:1px solid var(--hdr-line)}
.logos img{height:34px;width:auto;display:block}
.ann{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.ann.mine{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.ann-yes{background:var(--teal-soft);color:var(--teal);font-weight:600;border-radius:8px;padding:8px 10px;font-size:.88rem}
.annlist{display:flex;flex-wrap:wrap;gap:8px}
.annp{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:5px 10px 5px 5px;background:var(--panel-2)}
.annp b{display:block;font-size:.86rem}.annp small{display:block;color:var(--muted);font-size:.7rem}
.bnav{display:none}
.mob-only{display:none!important}
.brandmark{background:var(--teal);color:#fff;border-radius:6px;padding:3px 10px 4px;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-stretch:118%;font-size:1.15rem;letter-spacing:.01em}
.brandmark span{font-family:var(--f-body);font-stretch:100%;font-size:.6rem;font-weight:700;line-height:1.05;color:rgba(255,255,255,.8);letter-spacing:0;text-transform:uppercase}
.hright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hbtn{display:inline-flex;align-items:center;gap:8px;background:var(--hdr-btn);border:1px solid var(--hdr-line);color:var(--hdr-ink);border-radius:9px;padding:7px 12px;font-weight:600;font-size:.88rem;cursor:pointer;text-decoration:none;white-space:nowrap;position:relative}
.hbtn:hover{background:var(--panel)}
.seg{display:inline-flex;background:var(--hdr-btn);border:1px solid var(--hdr-line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--hdr-muted);font-weight:600;font-size:.84rem;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--teal);color:var(--teal-ink)}
.hbtn svg{width:16px;height:16px}
.hbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--teal);color:var(--teal-ink);font-size:.68rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--hdr)}
.tbar{display:flex;gap:8px;padding-block:4px 10px;overflow-x:auto;border-bottom:1px solid var(--hdr-line)}
.tbar .sep{width:1px;background:var(--hdr-line);margin:4px 2px;flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;padding-top:0;background:var(--hdr)}
.tab{display:flex;align-items:center;gap:9px;padding:11px 16px;color:var(--hdr-muted);text-decoration:none;font-weight:600;white-space:nowrap;border-radius:0}
.tab:hover{color:var(--hdr-ink)}
.tab .n{width:22px;height:22px;border-radius:5px;background:var(--hdr-btn);border:1px solid var(--hdr-line);display:grid;place-items:center;font-size:.76rem;color:var(--hdr-ink)}
.tab svg{width:16px;height:16px}
.tab .b{background:var(--teal);color:var(--teal-ink);font-size:.7rem;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.tab.on{background:var(--bg);color:var(--ink);border-radius:9px 9px 0 0}
.tab.on .n{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab.on .n{color:var(--teal-ink)}}
:root[data-theme="dark"] .tab.on .n{color:var(--teal-ink)}

.work{display:grid;grid-template-columns:250px minmax(0,1fr) 370px;min-height:0}
.lp,.cp,.rp{overflow:auto;min-width:0;min-height:0}
.lp{background:var(--panel);border-right:1px solid var(--line);padding:14px 12px 40px;display:flex;flex-direction:column;gap:16px}
.cp{padding:18px 20px 90px;display:flex;flex-direction:column;gap:18px}
.cp>*{flex-shrink:0}
.rp{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.work.solo{grid-template-columns:minmax(0,1fr)}
.work.solo .lp,.work.solo .rp{display:none}
.work.solo .cp{max-width:1180px;width:100%;margin:0 auto}

/* left panel */
.lsec{display:flex;flex-direction:column;gap:6px}
.lsec>.lbl-up{padding:0 4px 2px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;font-weight:600;cursor:pointer;text-align:center;color:var(--ink)}
.tool:hover{background:var(--panel-2)}
.tool svg{width:19px;height:19px}
.tool.on,.tool.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.lrow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;border:1px solid transparent;cursor:pointer;background:transparent;width:100%;text-align:left;color:var(--ink);font-size:.88rem}
.lrow:hover{background:var(--panel-2)}
.lrow.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:600}
.lrow .c{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.code{font-family:var(--f-mono);font-size:.62rem;font-weight:600;min-width:34px;height:20px;padding:0 4px;border-radius:4px;background:var(--code);color:#fff;display:inline-grid;place-items:center;flex:none;letter-spacing:.02em}
.code.ok{background:var(--ok);color:var(--panel)}.code.red{background:var(--red);color:var(--panel)}.code.off{background:var(--off);color:var(--panel)}.code.warn{background:var(--code-2)}.code.teal{background:var(--teal);color:var(--teal-ink)}
.lbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.84rem}
.lbox b.big{font-family:var(--f-mono);font-size:1.35rem}

/* center */
.hint{background:#13262C;color:#F0F6F7;border-radius:8px;padding:8px 12px;font-size:.85rem;align-self:flex-start}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hint{background:#E2ECEE;color:#13262C}}
:root[data-theme="dark"] .hint{background:#E2ECEE;color:#13262C}
.chead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.chead h1{font-size:1.35rem}
.chead p{color:var(--muted);font-size:.88rem;margin-top:3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.section-head p{color:var(--muted);font-size:.86rem;margin-top:3px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
.dt{min-width:760px}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.88rem}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel-2)}
tr.sel td{background:var(--teal-soft)}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who>div{min-width:0}
.who b{display:block;font-weight:600}
.who small{color:var(--muted);display:block}
.stamp{display:block;font-size:.72rem;color:var(--muted);margin-top:2px}

/* inspector */
.ihint{display:flex;gap:10px;padding:16px 18px;color:var(--muted);font-size:.9rem;border-bottom:1px solid var(--line)}
.ihint svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--teal)}
.itabs{display:flex;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
.itabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 10px;font-weight:600;font-size:.86rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.itabs button.on{color:var(--teal);border-bottom-color:var(--teal)}
.isec{padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:7px 10px;margin:0;font-size:.87rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);font-size:.87rem;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary,.btn.water{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.primary:hover,.btn.water:hover{filter:brightness(1.08)}
.btn.alert{background:var(--panel);border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 9px;font-size:.79rem;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.btn.wa{color:#128C4A}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.off{background:var(--off-soft);color:var(--off)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.water,.pill.teal{background:var(--teal-soft);color:var(--teal)}
.pill.sample{background:transparent;border:1px dashed var(--faint);color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.av{width:40px;height:40px;border-radius:9px;flex:none;object-fit:cover;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:700;font-size:.9rem;overflow:hidden}
.av.lg{width:96px;height:120px;border-radius:12px;font-size:1.8rem}
.av.sm{width:30px;height:30px;border-radius:7px;font-size:.72rem}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-width:0}
.search input{border:0;background:transparent;padding:8px 0;width:100%;outline:none;min-width:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1 1 220px}
select.input,input.input,textarea.input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea.input{min-height:90px;resize:vertical}
.note{font-size:.83rem;color:var(--muted);background:var(--panel-2);border-radius:8px;padding:10px 12px}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:32px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted);background:var(--panel)}
.empty h3{color:var(--ink)}
.empty p{max-width:56ch}
.meta{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:.83rem;color:var(--muted)}
.meta span{display:inline-flex;gap:5px;align-items:center}
.meta svg{width:14px;height:14px}

/* alerts list */
.alerts{display:flex;flex-direction:column;gap:10px}
.acard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 18px;text-decoration:none;color:var(--ink);cursor:pointer;text-align:left;width:100%}
.acard:hover{border-color:var(--teal)}
.acard.sel{box-shadow:0 0 0 2px var(--teal)}
.acard.closed{border-left-color:var(--off)}
.acard.filled{border-left-color:var(--ok)}
.acard .code-t{font-size:.75rem;color:var(--muted);font-family:var(--f-mono)}
.funnel{display:flex;gap:16px;align-items:center;text-align:right}
.funnel div{display:flex;flex-direction:column}
.funnel b{font-family:var(--f-mono);font-size:1.15rem;line-height:1.1}
.funnel span{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.deadline{font-size:.78rem;font-weight:600}

/* stats */
.stiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stiles.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.stile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stile b{display:block;font-family:var(--f-mono);font-size:1.7rem;line-height:1.1}
.stile span{font-size:.8rem;color:var(--muted);font-weight:600}
.stile.alert b{color:var(--teal)}
.mhero{padding:22px 24px}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.dlist{display:flex;flex-direction:column}
.ditem{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.ditem:first-child{border-top:0}
.ditem>div:not(.av){min-width:0;flex:1}
.ditem .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:5px;border-radius:9px;background:var(--panel-2);overflow:hidden;margin-top:5px}
.prog i{display:block;height:100%;background:var(--teal)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 56px;gap:12px;align-items:center;font-size:.85rem}
.bar .track{height:11px;border-radius:3px;background:var(--panel-2);overflow:hidden;display:flex}
.bar .track i{display:block;height:100%}
.bar .track i.a{background:var(--teal)}
.bar .track i.d{background:var(--red)}
.bar .n{text-align:right;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
